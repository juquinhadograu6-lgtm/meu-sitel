<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zumbi Store - Verificação</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #151922;
            border: 1px solid #232936;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        /* Logo em Círculo */
        .logo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Tela de Carregamento / Status */
        .status-box {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00ff66;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 14px;
            color: #c9d1d9;
        }

        .ip-display {
            font-family: monospace;
            font-size: 13px;
            color: #00ff66;
            background: rgba(0, 255, 102, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Botão */
        .btn-verify {
            width: 100%;
            background: #00ff66;
            color: #000;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-verify:hover {
            background: #00cc52;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .btn-verify:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Mensagem de Ban / Bloqueio */
        .banned-screen {
            display: none;
            color: #ff4d4d;
        }

        .banned-screen h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .banned-screen p {
            font-size: 14px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo da Zumbi Store -->
        <div class="logo-container">
            <!-- Substitua 'sua_imagem.png' pelo nome da foto enviada para o seu repositório -->
            <img src="1000173257.png" alt="Zumbi Store Logo">
        </div>

        <!-- Interface de Verificação -->
        <div id="verify-box">
            <h1>Zumbi Store</h1>
            <p class="subtitle">Verificação de Segurança & Acesso</p>

            <div class="status-box">
                <div class="spinner" id="spinner"></div>
                <div class="status-text" id="status-text">Detectando endereço IP...</div>
                <div class="ip-display" id="ip-display" style="display: none;"></div>
            </div>

            <button class="btn-verify" id="btn-action" disabled onclick="iniciarVerificacao()">
                Verificar Agora
            </button>
        </div>

        <!-- Tela de Acesso Negado (Banido) -->
        <div id="banned-box" class="banned-screen">
            <h2 style="color: #ff4d4d;">Acesso Bloqueado ❌</h2>
            <p id="ban-reason">Seu IP foi identificado na lista de banimento. Você não pode acessar este servidor/loja.</p>
        </div>
    </div>

    <script>
        // Lista de IPs banidos (Exemplo de controle no cliente)
        const ipsBanidos = [
            "123.456.789.0", // Adicione os IPs banidos aqui
            "0.0.0.0"
        ];

        let userIP = "";

        // Pega o IP do usuário via API externa gratuita
        async function obterIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;

                // Atualiza a tela
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('ip-display').style.display = 'inline-block';
                document.getElementById('ip-display').innerText = 'IP: ' + userIP;

                // Verifica se o IP está banido
                if (ipsBanidos.includes(userIP)) {
                    mostrarTelaBanido();
                } else {
                    document.getElementById('status-text').innerText = 'IP Seguro. Clique abaixo para prosseguir.';
                    document.getElementById('btn-action').disabled = false;
                }
            } catch (error) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('status-text').innerText = 'Aviso: Não foi possível obter o IP automaticamente.';
                document.getElementById('btn-action').disabled = false;
            }
        }

        function iniciarVerificacao() {
            const btn = document.getElementById('btn-action');
            const status = document.getElementById('status-text');
            const spinner = document.getElementById('spinner');

            btn.disabled = true;
            spinner.style.display = 'block';
            status.innerText = 'Validando credenciais e liberando acesso...';

            setTimeout(() => {
                spinner.style.display = 'none';
                status.style.color = '#00ff66';
                status.innerText = 'Verificação concluída com sucesso! Redirecionando...';

                // Exemplo: Redirecionar para o convite do Discord após verificar
                // window.location.href = "https://discord.gg/SEU_CONVITE";
            }, 2500);
        }

        function mostrarTelaBanido() {
            document.getElementById('verify-box').style.display = 'none';
            document.getElementById('banned-box').style.display = 'block';
        }

        // Inicia a checagem ao carregar a página
        window.onload = obterIP;
    </script>
</body>
</html>
