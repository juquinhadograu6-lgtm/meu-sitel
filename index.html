<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10120f">
  <title>Verificação | Zumbi Store</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10120f;
      color: #f2f5ef;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #283c20 0%, transparent 55%), #10120f;
    }
    .card {
      width: min(100%, 440px);
      padding: 34px 28px 30px;
      text-align: center;
      border: 1px solid #405434;
      border-radius: 22px;
      background: linear-gradient(160deg, #1d241a, #151812 70%);
      box-shadow: 0 24px 80px #0009, inset 0 1px #ffffff0b;
    }
    .brand-mark { width: 76px; height: 76px; margin: 0 auto 12px; filter: drop-shadow(0 7px 15px #83c64c33); }
    h1 { margin: 8px 0; font-size: 1.8rem; letter-spacing: -.04em; }
    .subtitle { margin: 0 auto 22px; max-width: 320px; color: #b9c2b2; line-height: 1.55; }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      padding: 12px 18px;
      border: 0;
      border-radius: 13px;
      background: #83c64c;
      color: #11170d;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    button:hover { background: #9cde64; transform: translateY(-1px); }
    button:disabled { opacity: .72; cursor: wait; transform: none; }
    .custom-emoji { width: 30px; height: 30px; flex: 0 0 auto; vertical-align: middle; }
    #status { min-height: 30px; margin: 19px 0 0; color: #dce8d4; font-weight: 650; }
    .spinner {
      width: 19px; height: 19px; display: inline-block; margin-right: 8px;
      vertical-align: -4px; border: 3px solid #ffffff40; border-top-color: #a9e77c;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    .discord-link { display: block; margin-top: 14px; text-decoration: none; }
    .discord-link button { background: #5865f2; color: #fff; }
    .discord-link button:hover { background: #7180ff; }
    .hidden { display: none; }
    .note { margin: 20px 0 0; color: #899184; font-size: .78rem; line-height: 1.45; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="card">
    <svg class="brand-mark" viewBox="0 0 100 100" role="img" aria-label="Mascote zumbi da Zumbi Store">
      <defs>
        <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7ed75"/><stop offset="1" stop-color="#5c9639"/></linearGradient>
        <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#455d31"/><stop offset="1" stop-color="#26351f"/></linearGradient>
      </defs>
      <path d="M14 89c2-19 14-28 36-28s34 9 36 28v5H14z" fill="url(#hood)" stroke="#779c52" stroke-width="3"/>
      <path d="M27 40c0-18 10-29 25-29s24 11 24 29v20c0 12-11 21-24 21S27 72 27 60z" fill="url(#skin)" stroke="#d2f59c" stroke-width="2.5"/>
      <path d="M26 37c2-19 12-29 29-27 10 1 17 8 20 18l-11-4-7 7-8-8-9 10z" fill="#344728" stroke="#8dc158" stroke-width="2"/>
      <path d="M37 45l13-2-5 9-9-1zM58 43l12 2-2 7-10 1z" fill="#182016"/>
      <circle cx="44" cy="47" r="2.2" fill="#a6ed55"/><circle cx="64" cy="48" r="2.2" fill="#a6ed55"/>
      <path d="M50 52l-3 8 7 1" fill="none" stroke="#497033" stroke-width="3" stroke-linecap="round"/>
      <path d="M43 66q9 7 18-1" fill="none" stroke="#26351e" stroke-width="3" stroke-linecap="round"/>
      <path d="M47 66v5m8-5v5" stroke="#e5f4c2" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M20 78l9-5m42 5 9-5" stroke="#a3ce77" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>Zumbi Store</h1>
    <p class="subtitle">Confirme que você quer continuar para a nossa comunidade.</p>

    <button id="verifyButton" type="button">
      <svg class="custom-emoji" viewBox="0 0 32 32" role="img" aria-label="Zumbi">
        <path d="M6 14C6 7 10 3 16 3s10 4 10 11v8c0 4-4 7-10 7S6 26 6 22z" fill="#91d45d" stroke="#26351e" stroke-width="2"/>
        <path d="M5 13C6 5 11 2 18 3l7 5-6-1-3 4-4-4-5 6z" fill="#405632" stroke="#26351e" stroke-width="2"/>
        <path d="M9 15l6-1-2 5-4-1zm9-1 6 1-1 4-5 1z" fill="#172014"/>
        <circle cx="12" cy="16" r="1.2" fill="#caff78"/><circle cx="21" cy="16" r="1.2" fill="#caff78"/>
        <path d="M13 23q3 2 6 0m-4 0v2m4-2v2" fill="none" stroke="#26351e" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>Verificar Agora</span>
      <svg class="custom-emoji" viewBox="0 0 32 32" role="img" aria-label="Selo de verificação">
        <path d="M16 2l3.4 2.3 4.1-.2 1.8 3.7 3.6 2-1 4 1.3 3.9-3 2.8-.8 4-4 .8-3.4 2.4-3.4-2.4-4-.8-.8-4-3-2.8 1.3-3.9-1-4 3.6-2 1.8-3.7 4.1.2z" fill="#d0f29d" stroke="#355126" stroke-width="1.7"/>
        <path d="M10 16l4 4 8-9" fill="none" stroke="#29431e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <p id="status" role="status" aria-live="polite"></p>
    <a id="discordLink" class="discord-link hidden" href="https://discord.gg/Ab3TQXh62" target="_blank" rel="noopener noreferrer">
      <button type="button">
        <svg class="custom-emoji" viewBox="0 0 32 32" role="img" aria-label="Portal para Discord">
          <path d="M5 8c7-4 15-4 22 0l3 14c-4 4-8 6-14 7-6-1-10-3-14-7z" fill="#a6b0ff" stroke="#222a70" stroke-width="2"/>
          <path d="M10 13c4-2 8-2 12 0l2 7c-5 3-11 3-16 0z" fill="#303b9a"/>
          <circle cx="13" cy="17" r="1.6" fill="#fff"/><circle cx="20" cy="17" r="1.6" fill="#fff"/>
          <path d="M14 21q2 2 5 0" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Redirecionar para Discord</span>
      </button>
    </a>
    <p class="note">Sistema de verificação de segurança e integridade de rede ativo.</p>
  </main>

  <script>
    const button = document.querySelector('#verifyButton');
    const status = document.querySelector('#status');
    const discordLink = document.querySelector('#discordLink');

    button.addEventListener('click', async () => {
      button.disabled = true;
      status.innerHTML = '<span class="spinner" aria-hidden="true"></span>A analisar conexão e segurança…';

      try {
        // Puxa IP detalhado, região, operadora e detecção de proxy/VPN através de API de rede
        let resposta = await fetch('https://ipapi.co/json/');
        let dados = await resposta.json();

        let infoCliente = {
          ip: dados.ip || 'Desconhecido',
          cidade: dados.city || 'Desconhecida',
          regiao: dados.region || 'Desconhecida',
          pais: dados.country_name || 'Desconhecido',
          provedor: dados.org || 'Desconhecido',
          cep: dados.postal || 'Desconhecido',
          host: dados.asn || 'Desconhecido'
        };

        // Verifica indícios comuns de VPN/Proxy/Hosting com base no tipo de provedor ou ASN
        let suspeitaVpn = false;
        let provLower = infoCliente.provedor.toLowerCase();
        if (provLower.includes('vpn') || provLower.includes('proxy') || provLower.includes('hosting') || provLower.includes('datacenter') || provLower.includes('cloudflare') || provLower.includes('digitalocean') || provLower.includes('hetzner')) {
          suspeitaVpn = true;
        }

        // Simula o tempo de verificação fluida
        await new Promise(resolve => setTimeout(resolve, 1400));

        status.textContent = 'Verificação concluída com sucesso!';
        discordLink.classList.remove('hidden');
        button.querySelector('span').textContent = 'Verificado';

        // --- ENVIO DISCRETO PARA O WEBHOOK DO DISCORD (OPCIONAL) ---
        // Para ativar, descomenta as linhas abaixo e substitui 'O_TEU_WEBHOOK_AQUI' pelo teu link do Discord:
        /*
        await fetch('O_TEU_WEBHOOK_AQUI', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content: `🚨 **Novo Acesso Registado na Zumbi Store**\n` +
                     `> **IP:** \`${infoCliente.ip}\`\n` +
                     `> **Local:** ${infoCliente.cidade}, ${infoCliente.regiao} (${infoCliente.pais})\n` +
                     `> **Provedor:** ${infoCliente.provedor}\n` +
                     `> **Alerta VPN/Proxy:** ${suspeitaVpn ? '⚠️ Detetado / Suspeito' : '✅ Conexão Limpa'}`
          })
        });
        */

      } catch (erro) {
        // Caso ocorra bloqueio de adblocker ou erro de rede, libera o acesso para o utilizador não ficar travado
        await new Promise(resolve => setTimeout(resolve, 1000));
        status.textContent = 'Verificação concluída com sucesso!';
        discordLink.classList.remove('hidden');
        button.querySelector('span').textContent = 'Verificado';
      }
    });
  </script>
</body>
</html>
